# SonarQube / SonarCloud Configuration for CloudSieve Pro
# Project Identification
sonar.projectKey=am4352_cloudsieve-pro
sonar.projectName=CloudSieve Pro
sonar.projectVersion=1.0.0
sonar.host.url=http://52.64.187.0:9000

# Source Code Paths
sonar.sources=backend,frontend/src
sonar.tests=backend/tests

# Language specific configurations
sonar.python.version=3.11
sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

# Inclusions & Exclusions
sonar.exclusions=**/node_modules/**,**/build/**,**/dist/**,**/*.spec.js,**/*.test.js,**/coverage/**,**/reports/**,**/__pycache__/**
sonar.test.inclusions=backend/tests/**

# Encoding
sonar.sourceEncoding=UTF-8
