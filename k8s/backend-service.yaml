---
# "backend" ClusterIP — nginx in frontend pods resolves this hostname
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: cloudsieve
  labels:
    app.kubernetes.io/name: cloudsieve-backend
    app.kubernetes.io/part-of: cloudsieve
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: cloudsieve-backend
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP
---
# NodePort for HAProxy on EC2 edge router (port 30800)
apiVersion: v1
kind: Service
metadata:
  name: cloudsieve-backend-svc
  namespace: cloudsieve
  labels:
    app.kubernetes.io/name: cloudsieve-backend
    app.kubernetes.io/part-of: cloudsieve
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: cloudsieve-backend
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      nodePort: 30800
      protocol: TCP
