---
# NodePort for HAProxy on EC2 edge router (port 30080)
apiVersion: v1
kind: Service
metadata:
  name: cloudsieve-frontend-svc
  namespace: cloudsieve
  labels:
    app.kubernetes.io/name: cloudsieve-frontend
    app.kubernetes.io/part-of: cloudsieve
spec:
  type: NodePort
  selector:
    app: cloudsieve-frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30080
      protocol: TCP
